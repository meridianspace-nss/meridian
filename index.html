<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian Space Settlement</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050818;
  --text: #e8ecff;
  --mut: #9aa3d4;
  --card: #0e1438;
  --line: #1e2a6a;
  --teal: #2ee6c8;
  --pink: #ff4fa3;
  --sun: #ffc93c;
  --vio: #9b7bff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Space Grotesk', system-ui, sans-serif;
  line-height: 1.55;
}
#particles {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
}
main {
  max-width: 1000px;
  margin: 0 auto;
  padding: 40px 20px 100px;
}
.hero {
  text-align: center;
  padding: 40px 0 20px;
}
.hero h1 {
  font-family: 'Unbounded', sans-serif;
  font-size: clamp(2.8rem, 9vw, 5.2rem);
  margin: 0;
  background: linear-gradient(90deg, var(--teal), var(--vio), var(--pink));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  filter: drop-shadow(0 0 20px rgba(155, 123, 255, 0.4));
}
.hero p {
  color: var(--mut);
  max-width: 620px;
  margin: 14px auto 0;
  font-size: 1.1rem;
}
section { margin-top: 60px; }
h2 {
  font-family: 'Unbounded', sans-serif;
  font-size: 1.9rem;
  margin: 0 0 16px;
  text-shadow: 0 0 12px rgba(46, 230, 200, 0.25);
}
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 24px;
  box-shadow: 0 0 30px rgba(46, 230, 200, 0.06);
}
.btns {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin: 14px 0;
}
button {
  border: 0;
  border-radius: 12px;
  padding: 10px 18px;
  font-weight: 700;
  cursor: pointer;
  background: var(--teal);
  color: #10123a;
  transition: 0.15s;
}
button:hover { filter: brightness(1.1); }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px;
  margin-top: 12px;
}
.item {
  background: #0a1030;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  text-align: center;
  cursor: pointer;
  transition: 0.2s;
}
.item:hover, .item.on {
  border-color: var(--teal);
  box-shadow: 0 0 14px rgba(46, 230, 200, 0.4);
}
#info, #mat-info, #job-detail {
  margin-top: 16px;
  color: var(--mut);
  min-height: 70px;
}
svg { width: 100%; max-width: 480px; display: block; margin: 0 auto; }
.seg { cursor: pointer; transition: 0.2s; }
.seg:hover, .seg.on { filter: brightness(1.35); }
input[type=range] { width: 100%; accent-color: var(--vio); margin: 6px 0 12px; }
.big {
  font-family: 'Unbounded', sans-serif;
  font-size: 2.6rem;
  margin: 8px 0;
  color: var(--teal);
}
</style>
</head>

<canvas id="particles"></canvas>
<main>
<header class="hero">
  <h1>Meridian</h1>
  <p>A rotating ring-shaped space settlement designed for the NSS Gerard K. O’Neill Space Settlement Contest.</p>
</header>
